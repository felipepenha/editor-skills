# Save as overleaf-pod.yaml
# Run with: podman play kube overleaf-pod.yaml
apiVersion: v1
kind: Pod
metadata:
  name: overleaf-pod
  labels:
    app: overleaf
spec:
  containers:
    # 1. Overleaf Community Edition Web & Services
    - name: overleaf-server
      image: docker.io/sharelatex/sharelatex:latest
      ports:
        - containerPort: 80
          hostPort: 8080
      env:
        - name: OVERLEAF_APP_NAME
          value: "Overleaf Community Edition"
        - name: OVERLEAF_NAV_TITLE
          value: "Overleaf Community Edition"
        - name: OVERLEAF_SITE_URL
          value: "http://localhost:8080"
        - name: OVERLEAF_MONGO_URL
          value: "mongodb://127.0.0.1:27017/sharelatex"
        - name: OVERLEAF_REDIS_HOST
          value: "127.0.0.1"
        - name: OVERLEAF_REDIS_PORT
          value: "6379"
        - name: OVERLEAF_INVITE_TOKEN_SECRET
          value: "change_this_to_a_random_32_byte_secret"
        - name: EMAIL_CONFIRMATION_DISABLED
          value: "true"
        - name: ENABLE_CONVERSIONS
          value: "true"
      volumeMounts:
        - mountPath: /var/lib/overleaf
          name: overleaf-data

    # 2. Redis In-Memory Store
    - name: overleaf-redis
      image: docker.io/library/redis:7-alpine
      command: ["redis-server", "--appendonly", "yes"]
      volumeMounts:
        - mountPath: /data
          name: redis-data

    # 3. MongoDB Database
    - name: overleaf-mongo
      image: docker.io/library/mongo:8.0
      command: ["mongod", "--bind_ip_all", "--replSet", "overleaf"]
      volumeMounts:
        - mountPath: /data/db
          name: mongo-data

  volumes:
    - name: overleaf-data
      persistentVolumeClaim:
        claimName: overleaf_data
    - name: redis-data
      persistentVolumeClaim:
        claimName: overleaf_redis_data
    - name: mongo-data
      persistentVolumeClaim:
        claimName: overleaf_mongo_data
